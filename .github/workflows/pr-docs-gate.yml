name: PR docs gate

# Runs on pull requests only. A push to main never runs this gate.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocks without RESEARCH.md, TEST-STRATEGY.md, IMPLEMENTATION-PLAN.md.
      # Exempts docs-only changes, dependency bumps, and small changes.
      - name: Check PR docs
        id: gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_DOCS_SUMMARY_FILE: ${{ runner.temp }}/pr-docs-summary.md
          PR_DOCS_MAX_SMALL_LINES: 20
        run: node scripts/pr-docs-check.mjs --branch "$HEAD_REF" --base "origin/$BASE_REF"

      # One comment per PR, updated on each run. Skipped without write access (for example, a fork).
      - name: Post the result on the PR
        if: always() && steps.gate.outcome != 'skipped'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ runner.temp }}/pr-docs-summary.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- pr-docs-gate -->";
            const text = fs.existsSync(process.env.SUMMARY_FILE)
              ? fs.readFileSync(process.env.SUMMARY_FILE, "utf8")
              : "## PR docs gate\n\nThe check did not write a summary. See the job log.";
            const body = `${marker}\n${text}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
